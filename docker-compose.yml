services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: ./server/.env
    # Note: no host port mapping. The api service is only reachable over the
    # internal Docker network, on port 3000 → 3001. Caddy is the only thing
    # on 80/443 on the host.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    build:
      context: .
      target: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  # Caddy persists its ACME account + issued certs here. If you wipe these
  # volumes, Caddy will re-issue certs on the next boot, but rate limits
  # apply — don't wipe them unless you have to.
  caddy_data:
  caddy_config:
