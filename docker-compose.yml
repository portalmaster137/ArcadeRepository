services:
  api:
    build:
      context: .
      target: api
      args:
        VITE_API_URL: https://api.porta137.com
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    restart: unless-stopped
    env_file: ./server/.env
    # Note: no host port mapping. The api service is only reachable over the
    # internal Docker network, on port 3000 → 3001. Caddy is the only thing
    # on 80/443 on the host.
    ports:
        - "127.0.0.1:39169:3000"
        - "127.0.0.1:39170:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - "arcadequeueclient-volume:/app/client/dist"
volumes:
  arcadequeueclient-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /hive/nucleus/caddy_mount/ArcadeQueueClient