services:
  api:
    build:
      context: .
      target: api
      args:
        VITE_API_URL: https://api.${DOMAIN:-porta137.com}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    restart: unless-stopped
    env_file: ./server/.env
    # The api is reachable only over the internal Docker network as `api:3001`.
    # Caddy (in the same compose project) is the only thing that talks to it;
    # nothing on the host should bind to 3000/3001 directly.
    expose:
      - "3000"
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    build:
      context: .
      target: caddy
    restart: unless-stopped
    environment:
      # Read by the Caddyfile's `{$DOMAIN}` placeholders. Override at
      # deploy time with `DOMAIN=host.example.com docker compose up`.
      DOMAIN: ${DOMAIN:-porta137.com}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
