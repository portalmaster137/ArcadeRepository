services:

  # ── Express API + Auth server ────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      # CLIENT_URL must match the public URL of the client container.
      # Override in .env if you're serving on a real domain.
      CLIENT_URL: ${CLIENT_URL:-http://localhost:80}
    expose:
      - "3001"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── React client served by nginx ─────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Firebase client config — baked into the JS bundle at build time.
        # Copy client/.env.example → client/.env and fill these in,
        # OR pass them via environment variables in CI.
        VITE_FIREBASE_API_KEY: AIzaSyA10_0s2B-XU2BD9pYKwPSO8oKq00XwjHE
        VITE_FIREBASE_AUTH_DOMAIN: arcadequeue.firebaseapp.com
        VITE_FIREBASE_PROJECT_ID: arcadequeue
        VITE_FIREBASE_STORAGE_BUCKET: arcadequeue.firebasestorage.app
        VITE_FIREBASE_MESSAGING_SENDER_ID: 14819136936
        VITE_FIREBASE_APP_ID: 1:14819136936:web:1c73a8ee2aef54b2f4399d
        # VITE_API_URL is empty here because nginx proxies /auth and /api
        # to the server container — no cross-origin requests needed.
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  default:
    name: sdvx-queue-net
